plugins {
    id 'com.android.application'
}

android {
    namespace 'com.zhj.panxia'
    compileSdk 35

    defaultConfig {
        applicationId 'com.zhj.panxia'
        minSdk 24
        targetSdk 35
        versionCode 10100
        versionName '1.1'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
}
